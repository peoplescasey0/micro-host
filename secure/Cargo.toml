[package]
name = "postcard-os-secure"
version = "0.2.0"
edition = "2021"
description = "Security vault, PCI passthrough, storage spooling, and sandbox isolation for Post Card OS"
license = "Apache-2.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.0"
